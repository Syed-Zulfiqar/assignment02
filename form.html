<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Application Form</h1>
    <form action="">
        <label for="first name"><b>First Name:</b></label>
        <input type="text" name="" id="first name" required maxlength="15" minlength="3">
        <label for="last name"><b>Last Name:</b></label>
        <input type="text" name="" id="last name"><br><br>
        <label for="date of birth"><b>Date of Birth:</b></label>
        <input type="date" name="" id="date of birth" required>
        <label for="Age"><b>Age:</b></label>
        <input type="number" name="" id="Age"><br><br>
        <label for="Gender"><b>Gender:</b></label>
        <select name="" id="Gender">
            <option value="">Male</option>
            <option value="">Female</option>
        </select>
        <label for="Email"><b>Email Address:</b></label>
        <input type="email" name="" id="Email" required><br><br>
        <label for=""><b>Position Available:</b></label>
        <input type="radio" name="Position" id="Junior Developer"><label for="Junior Developer">Junior Developer</label>
        <input type="radio" name="Position" id="Mid Level Developer"><label for="Mid Level Developer">Mid Level Developer</label>
        <input type="radio" name="Position" id="Senior Developer"><label for="Senior Developer">Senior Developer</label> <br><br>
        <label for=""><b>Programming Language:</b></label>
        <input type="checkbox" id="Java"> <label for="Java">Java</label>
        <input type="checkbox" id="Javascript"> <label for="Javascript">Javascript</label>
        <input type="checkbox" id="Python"> <label for="Python">Python</label><br><br>
        <label for="Password">Password:</label>
        <input type="password" id="Password" required maxlength="15" minlength="5">
        <label for="Confirm Password">Confirm Password:</label>
        <input type="password" id="Confirm Password" required><br><br>
        <input type="submit"> <input type="reset">
    </form>
</body>
</html>
